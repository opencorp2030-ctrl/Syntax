name: desktop-test
# Installe l'interface Syntax sur l'image de base et capture le bureau (rendu sans écran).
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/inspect.yml', 'ci/**', 'desktop/**', 'build/desktop-setup.sh', 'build/make-assets.sh', 'branding/**']
  workflow_dispatch:
jobs:
  shot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Base
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick librsvg2-bin fonts-inter >/dev/null
          curl -fsSL -o base.img.xz https://downloads.raspberrypi.com/raspios_arm64_latest
          xz -d base.img.xz; truncate -s +3G base.img; sudo parted -s base.img resizepart 2 100%
      - name: Interface + captures
        run: |
          LOOP=$(sudo losetup -fP --show base.img); sleep 1
          sudo e2fsck -fy ${LOOP}p2 >/dev/null || true; sudo resize2fs ${LOOP}p2 >/dev/null
          R=/mnt/r; sudo mkdir -p $R && sudo mount ${LOOP}p2 $R && sudo mount ${LOOP}p1 $R/boot/firmware
          sudo mount -t proc proc $R/proc; sudo mount -t sysfs sys $R/sys; sudo mount --bind /dev $R/dev; sudo mount --bind /dev/pts $R/dev/pts
          sudo mount -t tmpfs tmpfs $R/dev/shm; sudo mount -t tmpfs tmpfs $R/run
          sudo rm -f $R/etc/resolv.conf; sudo cp /etc/resolv.conf $R/etc/resolv.conf
          sudo build/make-assets.sh "$PWD" "$PWD/stage"
          sudo mkdir -p $R/tmp/syntax-build && sudo mount --bind "$PWD/stage" $R/tmp/syntax-build
          sudo cp ci/headless-shot.sh $R/tmp/
          C() { sudo chroot $R /usr/bin/env -i HOME=/root PATH=/usr/sbin:/usr/bin:/sbin:/bin DEBIAN_FRONTEND=noninteractive "$@"; }
          printf '#!/bin/sh\nexit 101\n' | sudo tee $R/usr/sbin/policy-rc.d >/dev/null; sudo chmod +x $R/usr/sbin/policy-rc.d
          C apt-get update -qq
          C bash -c "sed -i 's/^# *fr_FR.UTF-8 UTF-8/fr_FR.UTF-8 UTF-8/' /etc/locale.gen && locale-gen >/dev/null && update-locale LANG=fr_FR.UTF-8"
          C bash /tmp/syntax-build/desktop-setup.sh 2>&1 | grep -v '^Get:\|^Selecting\|^Preparing\|^Unpacking\|^Setting up\|Reading database'
          set +e
          echo "=== setup_env"; cat $R/usr/bin/setup_env
          HOOK='/usr/share/syntax/desktop/bin/launcher & sleep 4; grim /tmp/shot2.png; pkill -x fuzzel; sleep 1; pcmanfm >/dev/null 2>&1 & sleep 3; x-terminal-emulator 2>&1 | tail -3 & sleep 7; grim /tmp/shot3.png; /usr/share/syntax/desktop/bin/power-menu & sleep 3; grim /tmp/shot4.png; pkill -x fuzzel; pgrep -a -u $(id -u) . | cut -c1-100 | grep -v gvfs'
          C env SHOT_HOOK="$HOOK" bash /tmp/headless-shot.sh pi /tmp/shot.png 22
          for n in shot shot2 shot3 shot4; do
            sudo cp $R/tmp/$n.png $n.png && convert $n.png -resize 1280x -quality 70 $n.jpg && { echo "B64 $n"; base64 -w0 $n.jpg; echo; }
          done
          echo "=== fin"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: '*.png'
          retention-days: 7
