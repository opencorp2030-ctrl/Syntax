name: check-packages
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/check.yml']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Download base
        run: |
          curl -fsSL -o base.img.xz https://downloads.raspberrypi.com/raspios_arm64_latest
          xz -d base.img.xz
      - name: Query
        run: |
          LOOP=$(sudo losetup -fP --show base.img); sleep 1
          R=/mnt/r; sudo mkdir -p $R && sudo mount ${LOOP}p2 $R && sudo mount ${LOOP}p1 $R/boot/firmware
          sudo mount -t proc proc $R/proc; sudo mount -t sysfs sys $R/sys; sudo mount --bind /dev $R/dev
          sudo cp /etc/resolv.conf $R/etc/resolv.conf
          C() { sudo chroot $R /usr/bin/env -i HOME=/root PATH=/usr/sbin:/usr/bin:/sbin:/bin DEBIAN_FRONTEND=noninteractive "$@"; }
          C apt-get update -qq
          C apt-cache policy breeze-cursor-theme capitaine-cursors xcursor-themes oxygencursors \
            fonts-space-grotesk fonts-sora fonts-outfit fonts-manrope fonts-public-sans fonts-cabinet-grotesk \
            fonts-hanken-grotesk fonts-league-spartan fonts-archivo php php-cli libgtk-3-0 libnss3 libfuse2t64 golang-go \
            | grep -E '^[a-z0-9.-]+:$|Candidate'
