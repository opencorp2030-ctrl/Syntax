name: build-image
on:
  push:
    branches: ['claude/**', 'main']
    paths: ['build/**', 'system/**', 'rootfs/**', 'boot/**', 'branding/**', 'desktop/**', 'ci/headless-shot.sh', 'VERSION', '.github/workflows/build.yml']
  workflow_dispatch:
    inputs:
      release:
        description: Publier l'image dans une release GitHub
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils parted e2fsprogs dosfstools librsvg2-bin fonts-inter fonts-dejavu-core file \
            golang-go build-essential python3
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y --no-install-recommends nodejs
          node -v; npm -v; go version
          df -h /
      - name: Tests du portail
        run: |
          python3 -m py_compile system/syntaxlib.py system/cli.py system/portal/server.py system/portal/pamauth.py
          bash -n build/build-image.sh && bash -n build/chroot-setup.sh && bash -n build/fetch-apps.sh && bash -n build/desktop-setup.sh
          for f in system/libexec/*; do sh -n "$f"; done
      - name: Construction de l'image
        run: |
          VERSION="$(cat VERSION)"
          W="$PWD/work"
          if [ "$(df --output=avail -k /mnt | tail -1)" -gt "$(df --output=avail -k . | tail -1)" ]; then W=/mnt/syntax-work; fi
          sudo mkdir -p "$W/out" && ln -s "$W/out" out
          df -h / /mnt
          sudo VERSION="$VERSION" WORK="$W" OUT="$W/out" build/build-image.sh
          sudo chown -R "$USER" "$W/out"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Résumé
        run: |
          cd out
          ls -l
          SIZE=$(stat -c %s syntax-os-*.img.xz)
          {
            echo "### Syntax OS $VERSION"
            echo "- Image : \`$(ls syntax-os-*.img.xz)\` — $((SIZE / 1048576)) Mo"
            echo "- SHA-256 : \`$(cut -d' ' -f1 syntax-os-*.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Capture du bureau
        if: always()
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          for f in out/bureau*.png; do
            [ -f "$f" ] || continue
            convert "$f" -resize 1280x -quality 70 "${f%.png}.jpg" && { echo "B64 $f"; base64 -w0 "${f%.png}.jpg"; echo; }
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-bureau
          path: out/bureau*.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: syntax-os-${{ env.VERSION }}-arm64
          path: |
            out/*.img.xz
            out/*.tar.gz
            out/*.sha256
          compression-level: 0
          retention-days: 7
      - name: Release
        if: ${{ inputs.release || contains(github.event.head_commit.message, '[release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          TAG="v${VERSION}"
          FILES=(syntax-os-*.img.xz.sha256 syntax-update-*.tar.gz syntax-update-*.tar.gz.sha256)
          if [ "$(stat -c %s syntax-os-*.img.xz)" -gt 2100000000 ]; then
            split -b 1900M -d syntax-os-*.img.xz "$(ls syntax-os-*.img.xz).part"
            FILES+=(syntax-os-*.img.xz.part*)
          else
            FILES+=(syntax-os-*.img.xz)
          fi
          gh release delete "$TAG" --cleanup-tag -y -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create "$TAG" "${FILES[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Syntax OS $VERSION" --notes-file "$GITHUB_WORKSPACE/build/RELEASE_NOTES.md"
