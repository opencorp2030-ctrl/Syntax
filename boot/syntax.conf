# ───────────────────────────────────────────────────────────────
#  Syntax OS — configuration avant le premier démarrage (facultatif)
#  Modifie ce fichier depuis ton ordinateur après avoir flashé la carte,
#  puis démarre le Pi. Retire le « # » devant une ligne pour l'activer.
#  Les mots de passe et jetons sont effacés de ce fichier une fois appliqués.
# ───────────────────────────────────────────────────────────────

# Wi-Fi (inutile si le Pi est branché en Ethernet)
#WIFI_SSID=NomDeTaBox
#WIFI_PASSWORD=MotDePasseWifi
#WIFI_COUNTRY=FR

# Nom du Pi sur le réseau (portail : http://<nom>.local)
#HOSTNAME=syntax

# Accès par Internet : jeton d'un tunnel Cloudflare (Zero Trust → Réseaux → Tunnels).
# Le nom d'hôte public du tunnel doit pointer vers http://localhost:80
#CF_TUNNEL_TOKEN=eyJ...

# Activer SSH (désactivé par défaut)
#ENABLE_SSH=1

# Écran virtuel 1080p pour une utilisation sans moniteur (activé par défaut).
# Mets 0 si tu utilises un écran d'une autre définition.
#HEADLESS=1
