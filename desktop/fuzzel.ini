# Syntax OS — lanceur d'applications
[main]
font=Inter:size=13
icon-theme=Papirus-Dark
terminal=x-terminal-emulator -e
layer=overlay
prompt="  "
placeholder=Rechercher une application
width=44
lines=9
tabs=4
horizontal-pad=26
vertical-pad=22
inner-pad=14
line-height=34
letter-spacing=0
image-size-ratio=0.4
anchor=center
show-actions=no

[colors]
background=1d1d21f5
text=e8e8edff
prompt=7d6bffff
placeholder=Rechercher une application
input=ffffffff
match=9d8fffff
selection=5b54e8ff
selection-text=ffffffff
selection-match=ffffffff
border=ffffff24

[border]
width=1
radius=20
