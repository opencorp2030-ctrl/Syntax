# Syntax OS — lanceur d'applications
[main]
font=Inter:size=13
icon-theme=Papirus-Dark
terminal=x-terminal-emulator -e
layer=overlay
prompt="  "
placeholder=Rechercher une application
width=44
lines=9
tabs=4
horizontal-pad=26
vertical-pad=22
inner-pad=14
line-height=34
letter-spacing=0
image-size-ratio=0.4
anchor=center
show-actions=no

[colors]
background=1c1f22f5
text=f2f0ecff
prompt=ff7a45ff
placeholder=6c7278ff
input=ffffffff
match=ff9e6eff
selection=2a2e32ff
selection-text=ffffffff
selection-match=ff7a45ff
border=f2f0ec24

[border]
width=1
radius=20
